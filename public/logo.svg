<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6247"/>
      <stop offset="1" stop-color="#4b3425"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#f1e3d6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#e8c9a6" stroke-width="2" stroke-dasharray="2 6" opacity=".7"/>
  <!-- steam -->
  <g fill="none" stroke="#f3e2cf" stroke-width="5" stroke-linecap="round">
    <path d="M80 70 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path d="M100 66 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path d="M120 70 q-8 -10 0 -20 q8 -10 0 -20"/>
  </g>
  <!-- cup -->
  <path d="M56 82 h88 v10 a44 44 0 0 1 -44 44 a44 44 0 0 1 -44 -44 z" fill="url(#cup)"/>
  <path d="M144 92 h8 a14 14 0 0 1 0 28 h-12" fill="none" stroke="#fffaf4" stroke-width="7"/>
  <ellipse cx="100" cy="84" rx="44" ry="6" fill="#6f4e37"/>
  <!-- S monogram -->
  <text x="100" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" font-weight="700" fill="#6f4e37">S</text>
  <!-- saucer -->
  <ellipse cx="100" cy="146" rx="58" ry="7" fill="#f1e3d6"/>
  <text x="100" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#f3e2cf">SOFFITY</text>
</svg>
